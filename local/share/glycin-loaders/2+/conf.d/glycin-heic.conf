# Register the HEIF loader for image/heic as well.
#
# glycin ships /usr/share/glycin-loaders/2+/conf.d/glycin-heif.conf, which
# registers only image/avif and image/heif. Files from Apple devices report
# image/heic, a type shared-mime-info keeps distinct from image/heif, so the
# loader never matched them and GTK4 apps (Nautilus thumbnails, Sushi's
# spacebar preview) had no decoder for .HEIC at all.
#
# Same binary, same capabilities -- only the mime key differs.
[loader:image/heic]
Exec=/usr/lib/glycin-loaders/2+/glycin-heif

[editor:image/heic]
Exec=/usr/lib/glycin-loaders/2+/glycin-heif
Creator=true
CreatorColorIccProfile=true
CreatorEncodingQuality=true
